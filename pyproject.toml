[project]
name = "travel-agent"
version = "0.1.0"
description = "多城市行程规划 Agent：LLM 只做选择，事实由工具产出，行程由代码校验"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langchain-deepseek>=1.1",
    "langgraph>=1.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "ipykernel>=6.0",
    "notebook>=7.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

# 当前作为应用（而非可安装包）使用
[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
